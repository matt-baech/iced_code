[package]
name = "iced_code"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A code editor widget for Iced, with line numbers, undo/redo, find and replace, and code-editing shortcuts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matt-baech/iced_code"
keywords = ["iced", "editor", "widget", "gui", "code-editor"]
categories = ["gui", "text-editors"]

[dependencies]
iced_core = "0.14"
iced_graphics = "0.14"
iced_highlighter = { version = "0.14", optional = true }
log = "0.4"

[features]
default = ["highlighter"]
# Syntax highlighting with iced's syntect-based highlighter.
highlighter = ["dep:iced_highlighter"]

[dev-dependencies]
iced = { version = "0.14", features = ["highlighter"] }
iced_test = "0.14"
